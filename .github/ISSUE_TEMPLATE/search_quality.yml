name: Search quality report
description: A search did not find what it should
labels: ["engine", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "**Do not attach private documents.** Describe the problem instead."
  - type: textarea
    id: details
    attributes:
      label: Details
      description: "What did you search for, and what kind of document should have matched?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Catchword version and Windows version
