name: Bug report
description: Something is broken
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "**Do not attach private documents.** Describe the problem instead."
  - type: textarea
    id: details
    attributes:
      label: Details
      description: "What happened, and what did you expect?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Catchword version and Windows version
