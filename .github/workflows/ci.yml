name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit hashes: a tag can be moved to other
      # code, a hash cannot (threat T7). scripts/check-pinned-actions.sh
      # checks this. To update, find the release's commit and change both
      # the hash and the version in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs the version and components pinned in rust-toolchain.toml.
      # The version lines make the step fail if rustfmt or clippy is missing.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo fmt --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The desktop shell needs WebKitGTK to build on Linux (Tauri 2).
      - name: Install the desktop shell's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # The pinned downloads (about 200 MB) are kept between runs. A change to
      # a fetch script, and so to a pin, starts a fresh cache.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-*.sh') }}
      - name: Fetch PDFium
        shell: bash
        run: sh scripts/fetch-pdfium.sh
      - name: Fetch ONNX Runtime and the embedding model
        shell: bash
        run: sh scripts/fetch-embedding.sh
      - name: Fetch the evaluation data and the baseline model
        shell: bash
        run: sh scripts/fetch-eval.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test runs even after a failure, so one run shows them all.
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Privacy invariant
        if: runner.os == 'Linux'
        run: sh scripts/check-no-network.sh
      - name: Actions pinned to commit hashes
        if: runner.os == 'Linux'
        run: sh scripts/check-pinned-actions.sh
      - name: Interface packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      # A new contributor starts here (INF-3): it must find every tool.
      - name: Setup script finds the tools
        shell: bash
        run: sh scripts/setup.sh --check
      - name: Interface type check and tests
        working-directory: apps/desktop/ui
        shell: bash
        run: |
          npm ci --no-fund --no-audit
          npm run typecheck
          npm test
      # The GitHub build carries the updater (ADR-24): lint and test it too.
      - name: The GitHub build, with the updater
        run: |
          cargo clippy -p catchword-desktop --all-targets --features updater -- -D warnings
          cargo test -p catchword-desktop --features updater
      - name: Signing an update
        shell: bash
        run: sh scripts/test-sign-update.sh
      # Search quality must stay above eval/thresholds.txt (ADR-19, ADR-20).
      - name: Retrieval evaluation
        if: runner.os == 'Linux'
        run: cargo run -p catchword-eval -- check
