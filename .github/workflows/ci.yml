name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every Monday morning too (CI-2): new security advisories appear, and
  # GitHub's machines change, even when the code does not.
  schedule:
    - cron: "0 6 * * 1"
  # And by hand, from the Actions page.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit hashes: a tag can be moved to other
      # code, a hash cannot (threat T7). scripts/check-pinned-actions.sh
      # checks this. To update, find the release's commit and change both
      # the hash and the version in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the version and components pinned in rust-toolchain.toml.
      # The version lines make the step fail if rustfmt or clippy is missing.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo fmt --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The desktop shell needs WebKitGTK to build on Linux (Tauri 2).
      - name: Install the desktop shell's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # The pinned downloads (about 200 MB) are kept between runs. A change to
      # a fetch script, and so to a pin, starts a fresh cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-*.sh') }}
      - name: Fetch PDFium
        shell: bash
        run: sh scripts/fetch-pdfium.sh
      - name: Fetch ONNX Runtime and the embedding model
        shell: bash
        run: sh scripts/fetch-embedding.sh
      - name: Fetch the evaluation data and the baseline model
        shell: bash
        run: sh scripts/fetch-eval.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test runs even after a failure, so one run shows them all.
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Privacy invariant
        if: runner.os == 'Linux'
        run: sh scripts/check-no-network.sh
      - name: Actions pinned to commit hashes
        if: runner.os == 'Linux'
        run: sh scripts/check-pinned-actions.sh
      # Every dependency, for all three systems: known security problems,
      # licences and sources (MNT-3). The rules are in deny.toml.
      - name: Dependency policy
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Interface packages
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      # A new contributor starts here (INF-3): it must find every tool.
      - name: Setup script finds the tools
        shell: bash
        run: sh scripts/setup.sh --check
      - name: Interface type check and tests
        working-directory: apps/desktop/ui
        shell: bash
        run: |
          npm ci --no-fund --no-audit
          npm run typecheck
          npm test
      # The interface's packages pass the same policy (MNT-3): licences from
      # deny.toml's list, and npm's own check for known security problems.
      - name: Interface package policy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node --test scripts/check-npm-licences.test.mjs
          node scripts/check-npm-licences.mjs
          cd apps/desktop/ui && npm audit
      # The GitHub build carries the updater (ADR-24): lint and test it too.
      - name: The GitHub build, with the updater
        run: |
          cargo clippy -p catchword-desktop --all-targets --features updater -- -D warnings
          cargo test -p catchword-desktop --features updater
      - name: Signing an update
        shell: bash
        run: sh scripts/test-sign-update.sh
      # Search quality must stay above eval/thresholds.txt (ADR-19, ADR-20).
      - name: Retrieval evaluation
        if: runner.os == 'Linux'
        run: cargo run -p catchword-eval -- check
