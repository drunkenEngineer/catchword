name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Before the first release, pin these actions to commit hashes.
      - uses: actions/checkout@v4
      # Installs the version and components pinned in rust-toolchain.toml.
      # The version lines make the step fail if rustfmt or clippy is missing.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo fmt --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2
      # The pinned downloads (about 200 MB) are kept between runs. A change to
      # a fetch script, and so to a pin, starts a fresh cache.
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-*.sh') }}
      - name: Fetch PDFium
        shell: bash
        run: sh scripts/fetch-pdfium.sh
      - name: Fetch ONNX Runtime and the embedding model
        shell: bash
        run: sh scripts/fetch-embedding.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Privacy invariant
        if: runner.os == 'Linux'
        run: sh scripts/check-no-network.sh
