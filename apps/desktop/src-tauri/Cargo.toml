[package]
name = "catchword-desktop"
description = "Catchword desktop app: the Tauri shell around the service. The only place network code may ever live (none yet)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "catchword_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
anyhow.workspace = true
catchword-engine = { path = "../../../crates/engine" }
catchword-service = { path = "../../../crates/service" }
catchword-store = { path = "../../../crates/store" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
ts-rs = "12.0.1"

[dev-dependencies]
# The embedding speed measurement loads the model directly.
catchword-embed = { path = "../../../crates/embed" }

# Opening files through the shell API (threat T15), a lower priority for
# background indexing (RSC-2), the Windows version for diagnostics, and free
# disk space (RSC-3).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
