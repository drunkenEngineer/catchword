[workspace]
resolver = "2"
members = ["crates/engine", "crates/store", "crates/cli", "crates/worker", "crates/test-support"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
dunce = "1"
# PDFium binding. The image feature is off: only text is extracted.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
walkdir = "2"
windows-sys = "0.61"
