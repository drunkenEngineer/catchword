version.workspace = true
edition.workspace = true
license.workspace = true
# Part of the Catchword app, not a library for crates.io.
publish = false

[dependencies]
anyhow.workspace = true
catchword-embed = { path = "../embed" }
catchword-engine = { path = "../engine" }
catchword-store = { path = "../store" }

[dev-dependencies]
catchword-test-support = { path = "../test-support" }
