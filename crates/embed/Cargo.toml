[package]
name = "catchword-embed"
description = "Catchword embedding runtime: turns passages and queries into vectors with a local model. No network code, ever."
version.workspace = true
edition.workspace = true
license.workspace = true
# Part of the Catchword app, not a library for crates.io.
publish = false

[dependencies]
catchword-engine = { path = "../engine" }
ort.workspace = true
tokenizers.workspace = true

[dev-dependencies]
catchword-test-support = { path = "../test-support" }
# The model's checksums are taken by catchword_engine::hash_file; the
# tests compute one directly.
sha2.workspace = true
